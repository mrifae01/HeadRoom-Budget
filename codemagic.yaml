workflows:
  ios-sideload:
    name: iOS Unsigned (Sideloadly)
    max_build_duration: 60
    environment:
      node: v20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: cd ios && pod install --repo-update

      - name: Build unsigned iOS archive
        script: |
          xcodebuild \
            -workspace ios/headroom.xcworkspace \
            -scheme headroom \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$CM_BUILD_DIR/HeadRoom.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | xcpretty

      - name: Package as IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/HeadRoom.xcarchive" -name "*.app" | head -1)
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -r "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -r HeadRoom.ipa Payload

    artifacts:
      - $CM_BUILD_DIR/ipa/HeadRoom.ipa
